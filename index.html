<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffe4ec">
  <title>Feliz cumpelaños</title>
  <style>
    :root {
      --pink: #ff6f9f;
      --pink-dark: #e94d83;
      --ink: #432b3b;
      --paper: rgba(255, 255, 255, 0.82);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.9) 0 5px, transparent 6px),
        radial-gradient(circle at 85% 75%, rgba(255,255,255,.8) 0 7px, transparent 8px),
        linear-gradient(135deg, #ffe4ec, #fff1c9 52%, #e8e5ff);
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      position: relative;
      isolation: isolate;
    }

    .page::before,
    .page::after {
      content: "✦  ·  ✧  ·  ✦";
      position: fixed;
      z-index: -1;
      color: rgba(233, 77, 131, .27);
      font-size: clamp(25px, 5vw, 54px);
      letter-spacing: 18px;
      animation: drift 7s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .page::before { top: 9%; left: 4%; }
    .page::after { right: 2%; bottom: 8%; animation-delay: -3s; }

    .intro {
      width: min(760px, 100%);
      text-align: center;
      padding: clamp(30px, 7vw, 68px) 22px;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 30px;
      background: var(--paper);
      box-shadow: 0 20px 60px rgba(119, 65, 93, .15);
      backdrop-filter: blur(8px);
      animation: appear .8s ease both;
    }

    h1 {
      margin: 0 0 30px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 8vw, 5.4rem);
      line-height: 1.08;
      color: var(--pink-dark);
      text-wrap: balance;
      text-shadow: 2px 3px 0 rgba(255, 255, 255, .9);
    }

    .open-button {
      border: 0;
      border-radius: 999px;
      padding: 16px 30px;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: #fff;
      font: 700 1.08rem "Trebuchet MS", Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 9px 0 #c93e70, 0 14px 24px rgba(201, 62, 112, .22);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .open-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 0 #c93e70, 0 17px 27px rgba(201, 62, 112, .25);
      filter: brightness(1.04);
    }

    .open-button:active {
      transform: translateY(5px);
      box-shadow: 0 4px 0 #c93e70, 0 8px 15px rgba(201, 62, 112, .2);
    }

    .open-button:focus-visible {
      outline: 4px solid #7544a0;
      outline-offset: 5px;
    }

    .surprise {
      width: min(1120px, 100%);
      display: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(20px, 4vw, 42px);
      align-items: stretch;
    }

    .surprise.visible {
      display: grid;
      animation: appear .7s ease both;
    }

    .person-card {
      min-width: 0;
      padding: clamp(17px, 3vw, 28px);
      text-align: center;
      border: 2px solid rgba(255,255,255,.88);
      border-radius: 26px;
      background: var(--paper);
      box-shadow: 0 18px 45px rgba(119, 65, 93, .16);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .person-card img {
      display: block;
      width: 100%;
      height: clamp(240px, 36vw, 390px);
      object-fit: contain;
      border-radius: 17px;
      background: rgba(255,255,255,.58);
    }

    .person-card p {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.35rem);
      font-weight: 700;
      line-height: 1.5;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes drift {
      from { transform: translateY(0) rotate(-7deg); }
      to { transform: translateY(18px) rotate(7deg); }
    }

    @media (max-width: 700px) {
      .surprise.visible { grid-template-columns: 1fr; max-width: 520px; }
      .person-card img { height: min(72vw, 340px); }
      .page { padding: 24px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="intro" id="intro" aria-labelledby="greeting">
      <h1 id="greeting">Feliz cumpelaños</h1>
      <button class="open-button" id="openSurprise" type="button">abrir sorpresa....</button>
    </section>

    <section class="surprise" id="surprise" aria-label="La sorpresa de cumpleaños" aria-hidden="true">
      <!-- Lado izquierdo -->
      <article class="person-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRuKgIguIIsJVELmyc1gQJp6uSaHPKnN1jgp4tCicswVQ&s=10"
          alt="Imagen del saludo de la izquierda"
        >
        <p>Hola keace feli cumpliberdey gorda</p>
      </article>

      <!-- Lado derecho -->
      <article class="person-card">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSViTEqz24u9sGdN1CL6uMh5XK1Sg9y0UUJijyNJ3bHrg&s=10"
          alt="Imagen del saludo de Martin"
        >
        <p>Hola soy Martin, Jorge me dijo que te salude xd</p>
      </article>
    </section>
  </main>

  <script>
    const openButton = document.getElementById("openSurprise");
    const intro = document.getElementById("intro");
    const surprise = document.getElementById("surprise");

    openButton.addEventListener("click", () => {
      intro.hidden = true;
      surprise.classList.add("visible");
      surprise.setAttribute("aria-hidden", "false");
    });
  </script>
</body>
</html>
